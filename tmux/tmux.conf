# ========================
# Tokyo Night - tmux
# ========================
# Portado de ~/.psmux.conf (Windows). Diferencias respecto a psmux:
#   * las opciones de ventana (tabs, bordes, copy-mode) van con 'setw -g':
#     en tmux son opciones de ventana, no de servidor.
#   * 'allow-predictions' no existe en tmux: se omitio.
#   * 'extended-keys' si existe en tmux: se activa.

# --- Barra de estado ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #{?#{==:#{session_name},Work},WORK,#S}  #[fg=#7aa2f7,bg=#{?#{==:#{window_index},0},#bb9af7,#1a1b26}]"
set -g status-right "#[fg=#565f89]%d-%b #[fg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7,bold]  %H:%M "
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"

# --- Ventanas, bordes y copy mode ---
setw -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "
setw -g window-status-style "fg=#565f89,bg=#1a1b26"
setw -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7]#{?#{==:#{window_index},0},,}#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W #[fg=#bb9af7,bg=#1a1b26]"
setw -g window-status-current-style "fg=#1a1b26,bg=#bb9af7,bold"
setw -g window-status-separator ""
setw -g pane-border-style "fg=#3b4261,bg=#16161e"
setw -g pane-active-border-style "fg=#7aa2f7,bg=#16161e"
setw -g mode-style "bg=#7aa2f7,fg=#1a1b26"

# --- Prefijo ---
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# tmux soporta teclas extendidas (psmux no las implementaba)
set -s extended-keys on

# --- Lanzadores de Windows ---
# prefijo + P: abre PowerShell 7 (pwsh.exe) en una ventana de tmux de la sesión
# actual (no en una ventana nueva de Alacritty). pwsh.exe se ejecuta por interop
# de WSL dentro del panel: consola Win32 sobre un pty de Linux, con el prompt de
# Starship y el cwd heredado del panel activo.
bind-key P new-window -n pwsh -c '#{pane_current_path}' "pwsh.exe -NoLogo"
