[window]
# Márgenes internos para que el texto no pegue con los bordes
padding = { x = 7, y = 5 }
dynamic_padding = true
opacity = 0.95
decorations = "Full"
dimensions = { columns = 120, lines = 35 }

[font]
# Tipografía principal (CommitMono Nerd Font)
size = 11.0

[font.normal]
family = "CommitMono Nerd Font"
style = "Regular"

[font.bold]
family = "CommitMono Nerd Font"
style = "Bold"

[font.italic]
family = "CommitMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CommitMono Nerd Font"
style = "Bold Italic"

# Esquema de colores estilo Catppuccin Mocha / Dark Low-Saturation
#[colors.primary]
#background = "#1e1e2e"
#foreground = "#cdd6f4"

#[colors.cursor]
#text = "#1e1e2e"
#cursor = "#f5e0dc"

#[colors.normal]
#black = "#45475a"
#red = "#f38ba8"
#green = "#a6e3a1"
#yellow = "#f9e2af"
#blue = "#89b4fa"
#magenta = "#f5c2e7"
#cyan = "#94e2d5"
#white = "#bac2de"

#[colors.bright]
#black = "#585b70"
#red = "#f38ba8"
#green = "#a6e3a1"
#yellow = "#f9e2af"
#blue = "#89b4fa"
#magenta = "#f5c2e7"
#cyan = "#94e2d5"
#white = "#a6adc8"

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[env]
# Forzar TERM para compatibilidad con Neovim y herramientas modernas
TERM = "xterm-256color"

[terminal.shell]
program = "pwsh.exe"
args = ["-NoLogo", "-NoExit", "-Command", "Set-Location ~"]

[scrolling]
history = 5000                 # menos historial = menos memoria

[cursor]
style = { shape = "Block"}

[selection]
save_to_clipboard = true       # seleccionar = copiar

[keyboard]
bindings = [
  { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Control", action = "ResetFontSize" },
  { key = "NumpadEnter", chars = "\r" },
]
