# Perfil por defecto: Fedora 44 en WSL.
# Los ajustes visuales viven en common.toml; aquí solo el título y la shell.
[general]
import = ["common.toml"]

[window]
# wsl.exe se apropia del título ("C:\WINDOWS\SYSTEM32\wsl.exe");
# fijarlo evita eso y deja claro el contexto Linux.
title = "Fedora 44 · WSL"
dynamic_title = false

[terminal.shell]
# Arranque por defecto en Fedora (WSL) y no en PowerShell.
# "--cd ~" usa el home de Linux; la tilde se pasa literal (Alacritty no expande).
program = "wsl.exe"
args = ["-d", "FedoraLinux-44", "--cd", "~"]
