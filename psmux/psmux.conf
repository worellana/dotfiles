# ========================
# Tokyo Night Theme - psmux
# ========================

# Colores base Tokyo Night
# bg        = #1a1b26
# bg_dark   = #16161e
# bg_highlight = #292e42
# terminal_black = #414868
# fg        = #c0caf5
# fg_dark   = #a9b1d6
# fg_gutter = #3b4261
# dark3     = #545c7e
# comment   = #565f89
# blue      = #7aa2f7
# cyan      = #7dcfff
# green     = #9ece6a
# magenta   = #bb9af7
# orange    = #ff9e64
# red       = #f7768e
# yellow    = #e0af68

# Status bar general
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Longitudes
set -g status-left-length 40
set -g status-right-length 60

# === Left side ===
# Réplica del bloque "NORMAL" del statusline de lualine: mayúsculas en bold
# sobre #7aa2f7, con el separador de sección  (U+E0B0) al final del bloque y
# siempre visible. El fondo de esa celda es dinámico: morado (#bb9af7) cuando
# la ventana activa es la 0, porque ahí arranca el bloque morado de esa
# pestaña y el separador queda encima del morado, sin ninguna celda del fondo
# de la barra en medio; en cualquier otro caso es el fondo de la barra
# (#1a1b26), como el ► de lualine sobre el tabline.
# Detrás del separador no hay espacio: la pestaña (o su propio separador)
# empieza en la celda siguiente, por eso no aparece el hueco negro.
# psmux no implementa conversión a mayúsculas en formatos (#{s/.../.../} se
# ignora), por eso la sesión "Work" se rotula "WORK"; las demás sesiones
# conservan su nombre tal cual.
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #{?#{==:#{session_name},Work},WORK,#S}  #[fg=#7aa2f7,bg=#{?#{==:#{window_index},0},#bb9af7,#1a1b26}]"

# === Right side ===
# Fecha atenuada y, alineado al borde derecho, el bloque azul del reloj con el
# separador izquierdo  (U+E0B2) sobre el fondo de la barra: misma forma y ancho
# que el bloque del reloj de lualine.
set -g status-right "#[fg=#565f89]%d-%b #[fg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7,bold]  %H:%M "

# === Window tabs ===
# Ventana inactiva: texto atenuado con su relleno; sin separador.
set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "
set -g window-status-style "fg=#565f89,bg=#1a1b26"

# Ventana activa: bloque morado con relleno. Su separador  va en el color del
# fondo de la barra (#1a1b26, el mismo fondo que tiene la pestaña anterior), de
# modo que se lee como un recorte en el borde izquierdo del bloque morado.
# Sólo se pinta si la ventana no es la 0, porque en ese caso ya lo dibuja
# status-left; así nunca salen dos flechas seguidas y toda ventana nueva
# hereda la misma forma y el mismo separador.
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7]#{?#{==:#{window_index},0},,}#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W #[fg=#bb9af7,bg=#1a1b26]"
set -g window-status-current-style "fg=#1a1b26,bg=#bb9af7,bold"

# Separador entre ventanas
set -g window-status-separator ""

# === Bordes de panes ===
# Se quitó pane-border-status: psmux solo pintaba el primer carácter de
# pane-border-format con bg #16161e y dejaba el resto con el fondo del
# terminal, produciendo un bloque negro aislado sobre la barra de estado.
# Los bordes de splits siguen usando estos estilos.
set -g pane-border-style "fg=#3b4261,bg=#16161e"
set -g pane-active-border-style "fg=#7aa2f7,bg=#16161e"

# === Mensajes ===
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"

# === Copy mode ===
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"

unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# psmux 3.4.0 no implementa 'extended-keys' (ni como opción global ni de servidor):
#   psmux: unknown option 'extended-keys'
# Dejar la línea activa solo genera warning en cada arranque. ConPTY ya entrega
# las teclas extendidas a la app, así que no hace falta.
#set -g extended-keys on

set -g allow-predictions on
